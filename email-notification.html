<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>{{subject}}</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f4f6f8; font-family:Arial, Helvetica, sans-serif; color:#1f2937;">
    <!-- Preheader text: shown beside the subject in many email clients -->
    <div style="display:none; max-height:0; overflow:hidden; opacity:0; color:transparent;">
      {{preheader}}
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f6f8;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
            style="width:100%; max-width:600px; background-color:#ffffff; border-radius:8px; overflow:hidden;">

            <tr>
              <td align="center" style="padding:28px 32px; background-color:#ffffff;">
                <a href="{{home_url}}" style="text-decoration:none; color:#1f2937; font-size:20px; font-weight:bold;">
                  {{company_name}}
                </a>
              </td>
            </tr>

            <tr>
              <td style="padding:8px 32px 32px;">
                <h1 style="margin:0 0 16px; font-size:24px; line-height:1.3; color:#111827;">
                  {{heading}}
                </h1>

                <p style="margin:0 0 16px; font-size:16px; line-height:1.6;">
                  Hi {{recipient_name}},
                </p>

                <p style="margin:0 0 24px; font-size:16px; line-height:1.6; color:#4b5563;">
                  {{message}}
                </p>

                <!-- Optional details section -->
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                  style="margin:0 0 24px; background-color:#f9fafb; border:1px solid #e5e7eb; border-radius:6px;">
                  <tr>
                    <td style="padding:16px; font-size:14px; line-height:1.6; color:#4b5563;">
                      {{details}}
                    </td>
                  </tr>
                </table>

                <!-- Button -->
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td align="center" bgcolor="#2563eb" style="border-radius:6px;">
                      <a href="{{action_url}}"
                        style="display:inline-block; padding:12px 22px; color:#ffffff; font-size:16px; font-weight:bold; text-decoration:none; border-radius:6px;">
                        {{action_label}}
                      </a>
                    </td>
                  </tr>
                </table>

                <p style="margin:24px 0 0; font-size:14px; line-height:1.6; color:#6b7280;">
                  If you have questions, reply to this email or contact us at
                  <a href="mailto:{{support_email}}" style="color:#2563eb; text-decoration:underline;">{{support_email}}</a>.
                </p>
              </td>
            </tr>

            <tr>
              <td align="center" style="padding:24px 32px; background-color:#f9fafb; border-top:1px solid #e5e7eb;">
                <p style="margin:0 0 8px; font-size:12px; line-height:1.5; color:#6b7280;">
                  {{company_name}} · {{company_address}}
                </p>
                <p style="margin:0; font-size:12px; line-height:1.5; color:#6b7280;">
                  <a href="{{preferences_url}}" style="color:#6b7280; text-decoration:underline;">Email preferences</a>
                  &nbsp;|&nbsp;
                  <a href="{{unsubscribe_url}}" style="color:#6b7280; text-decoration:underline;">Unsubscribe</a>
                </p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
